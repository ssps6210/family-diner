<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C4694A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>爸爸媽媽小食堂</title>
<style>
:root{
  --enamel:#FDF5E7;
  --enamel-2:#F5E7D1;
  --card:#FFFCF6;
  --rim:#C4694A;
  --rim-dark:#A4502F;
  --pine:#7C8A46;
  --ink:#4A382B;
  --ink-soft:#95816A;
  --line:#EADBC2;
  --gold:#BE8A2C;
  --heart:#D2635C;
  --shadow:0 1px 2px rgba(120,84,44,.07),0 6px 14px rgba(120,84,44,.05);
  /* 圓潤可愛的字：先用粉圓，抓不到就退回裝置自己的圓體或黑體 */
  --sans:"Huninn","jf-openhuninn","Yuanti TC","Yuanti SC","Hiragino Maru Gothic ProN",
         "Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:var(--sans);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--enamel);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.65;
  overscroll-behavior:none;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
[hidden]{display:none !important}

/* ---------- 頂欄 ---------- */
.top{
  background:linear-gradient(178deg,#D07E52 0%,#C4694A 62%,#B95C40 100%);
  color:#fff;padding:14px 18px 12px;
  display:flex;align-items:center;gap:14px;
  border-bottom:5px double rgba(255,255,255,.45);
  position:sticky;top:0;z-index:30;
}
.shop{
  font-family:var(--serif);font-size:clamp(20px,4.6vw,27px);font-weight:700;
  letter-spacing:.06em;margin:0;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.shop small{
  display:block;font-family:var(--sans);font-size:12px;letter-spacing:.24em;
  font-weight:400;opacity:.72;margin-top:2px;
}
.topbtn{
  background:rgba(74,56,43,.26);color:#fff;padding:10px 18px;
  border-radius:999px;font-size:16px;font-weight:600;white-space:nowrap;
}
.topbtn:active{background:rgba(74,56,43,.42)}

/* ---------- 菜單 ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 150px}
.cat{
  font-family:var(--serif);font-size:19px;font-weight:700;color:var(--rim);
  margin:34px auto 16px;max-width:880px;
  display:flex;align-items:center;gap:14px;letter-spacing:.22em;
}
.cat::before,.cat::after{content:"";flex:1;height:0;border-top:1px solid var(--line);border-bottom:3px double var(--line)}
.cat:first-child{margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:880px;margin:0 auto}

.dish{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;padding:0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;text-align:left;width:100%;
}
.dish:active{background:var(--enamel-2)}
.thumb{
  position:relative;width:100%;aspect-ratio:3/2;
  background:var(--enamel-2);overflow:hidden;flex:none;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg,.edit .pic svg{width:100%;height:100%;display:block}
.thumb .ph{
  width:100%;height:100%;display:grid;place-items:center;
  font-family:var(--serif);font-size:52px;font-weight:700;color:#fff;opacity:.9;
}
.body{padding:14px 16px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.dish .nm{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.3;letter-spacing:.03em}
.dish .note{font-size:14px;color:var(--ink-soft);line-height:1.4}
.dish .price{margin-top:auto;padding-top:9px;display:flex;align-items:center;gap:10px}
.dish .price::before{content:"";flex:1;border-bottom:2.5px dotted var(--line);transform:translateY(-3px)}
.hearts{display:inline-flex;align-items:center;gap:2px;color:var(--heart);line-height:1}
.hearts svg{display:block}
.hearts b{font-size:15px;font-weight:700;margin-left:3px;font-variant-numeric:tabular-nums}
.bar .hearts,.free{color:#F2B8A6}
.free{font-size:15px}
.dish .free{color:var(--ink-soft)}
.over{color:#F0A08C}
.dish.out .thumb{filter:grayscale(1);opacity:.5}
.dish.out .nm{text-decoration:line-through;color:var(--ink-soft)}
.soldtag{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);
  background:rgba(74,56,43,.86);color:#fff;border:2px solid rgba(255,255,255,.7);
  font-size:15px;padding:6px 18px;border-radius:999px;letter-spacing:.14em;font-weight:700;
}
.no{
  position:absolute;left:0;top:14px;z-index:2;
  background:var(--ink);color:var(--enamel);
  font-size:12px;padding:3px 10px 3px 9px;border-radius:0 999px 999px 0;
  letter-spacing:.14em;font-variant-numeric:tabular-nums;
}
.stamp{
  position:absolute;right:8px;top:8px;width:46px;height:46px;border-radius:50%;
  background:var(--rim);color:#fff;display:grid;place-items:center;
  font-family:var(--serif);font-size:22px;font-weight:700;
  transform:rotate(-9deg);box-shadow:0 0 0 3px var(--card);
}
.step{display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 16px 14px}
.step button{
  width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rim);
  color:var(--rim);font-size:23px;line-height:1;display:grid;place-items:center;
}
.step button:active{background:var(--rim);color:#fff}
.step .q{font-size:20px;font-weight:700;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- 結算條 ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:#5B4433;color:#fff;box-shadow:0 -4px 18px rgba(90,60,30,.16);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px;transform:translateY(110%);
}
.bar.on{transform:none}
@media (prefers-reduced-motion:no-preference){.bar{transition:transform .18s ease-out}}
.bar .sum{flex:1;min-width:0}
.bar .sum b{font-size:20px;font-variant-numeric:tabular-nums}
.bar .sum span{display:block;font-size:13px;opacity:.66;margin-top:1px}
.bar .go{background:var(--rim);color:#fff;padding:14px 30px;border-radius:999px;font-size:18px;font-weight:700}
.bar .go:active{background:var(--rim-dark)}
.bar .clr{color:#fff;opacity:.6;font-size:15px;padding:10px}

/* ---------- 彈層 ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(74,56,43,.46);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.card{
  background:var(--enamel);width:100%;max-width:620px;border-radius:18px 18px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
}
.card h2{font-family:var(--serif);font-size:24px;margin:0 0 16px;font-weight:700;letter-spacing:.03em}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:17px}
.row b{font-variant-numeric:tabular-nums;font-weight:600}
.total{display:flex;justify-content:space-between;padding:14px 0 4px;font-size:20px;font-weight:700}
.field{display:block;margin:16px 0 6px;font-size:14px;color:var(--ink-soft)}
input[type=text],input[type=number],input[type=url]{
  width:100%;padding:13px 14px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);font-size:17px;
}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.who button{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;font-size:16px}
.who button:active{background:var(--pine);color:#fff;border-color:var(--pine)}
.btn{width:100%;background:var(--rim);color:#fff;padding:16px;border-radius:10px;font-size:19px;font-weight:700;margin-top:20px}
.btn:active{background:var(--rim-dark)}
.btn.ghost{background:none;color:var(--ink-soft);font-weight:500;font-size:16px;margin-top:8px}

/* ---------- 廚房 ---------- */
.tabs{display:flex;gap:6px;padding:14px 16px 0;max-width:1100px;margin:0 auto}
.tabs button{
  flex:1;padding:13px 6px;border-radius:10px 10px 0 0;
  border:1px solid var(--line);border-bottom:none;
  background:var(--enamel-2);color:var(--ink-soft);font-size:16px;font-weight:600;
}
.tabs button[aria-selected=true]{background:var(--card);color:var(--rim)}

.order{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--rim);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.order.done{border-left-color:var(--pine);opacity:.6}
.order .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.order .hd b{font-family:var(--serif);font-size:21px}
.order .hd time{font-size:13px;color:var(--ink-soft)}
.order ul{margin:0;padding:0;list-style:none;font-size:16px}
.order li{display:flex;justify-content:space-between;padding:4px 0}
.order .act{display:flex;gap:10px;margin-top:12px}
.order .act button{border:1px solid var(--line);padding:9px 18px;border-radius:9px;font-size:15px;background:var(--card)}
.order .act .ok{border-color:var(--pine);color:var(--pine);font-weight:600}

/* 編輯行 */
.edit{
  background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:14px;margin-bottom:12px;
  display:grid;gap:10px;
  grid-template-columns:120px 1fr 110px 130px;
  align-items:start;
}
.edit .pic{
  grid-row:span 2;width:120px;aspect-ratio:1;border-radius:9px;overflow:hidden;
  background:var(--enamel-2);border:1px solid var(--line);position:relative;padding:0;
}
.edit .pic img{width:100%;height:100%;object-fit:cover;display:block}
.edit .pic .ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--serif);font-size:34px;color:#fff}
.edit .pic .lbl{
  position:absolute;left:0;right:0;bottom:0;background:rgba(74,56,43,.74);
  color:#fff;font-size:13px;padding:5px 0;text-align:center;
}
.edit .full{grid-column:2/-1}
.edit .tools{grid-column:2/-1;display:flex;gap:10px;align-items:center;font-size:15px;flex-wrap:wrap}
.edit .tools label{display:flex;align-items:center;gap:7px;color:var(--ink-soft)}
.edit .tools input[type=checkbox]{width:22px;height:22px}
.edit .lnk{color:var(--pine);padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px}
.edit .del{margin-left:auto;color:var(--rim);padding:8px 14px;border:1px solid var(--line);border-radius:9px}
@media(max-width:620px){
  .edit{grid-template-columns:96px 1fr}
  .edit .pic{width:96px;grid-row:span 3}
  .edit .full,.edit .tools{grid-column:1/-1}
}

.empty{text-align:center;color:var(--ink-soft);padding:64px 20px;font-size:17px}
.empty b{display:block;font-family:var(--serif);font-size:21px;color:var(--ink);margin-bottom:8px}
.hint{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:18px 0 0}
.meter{height:8px;background:var(--enamel-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--pine)}
.toast{
  position:fixed;left:50%;bottom:120px;transform:translateX(-50%);
  background:#5B4433;color:#fff;padding:13px 26px;border-radius:999px;
  font-size:16px;z-index:60;opacity:0;pointer-events:none;max-width:86vw;text-align:center;
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s}}
</style>
</head>
<body>

<header class="top">
  <h1 class="shop" id="shopName">爸爸媽媽小食堂<small>花愛心吃晚餐</small></h1>
  <button class="topbtn" id="navBtn">廚房</button>
</header>

<div id="viewOrder"><div class="wrap" id="menuArea"></div></div>

<div id="viewKitchen" hidden>
  <div class="tabs">
    <button id="tabOrders" aria-selected="true">訂單</button>
    <button id="tabMenu" aria-selected="false">改菜單</button>
    <button id="tabSet" aria-selected="false">設定</button>
  </div>
  <div class="wrap" style="padding-top:16px">
    <div id="paneOrders"></div>
    <div id="paneMenu" hidden></div>
    <div id="paneSet" hidden></div>
  </div>
</div>

<div class="bar" id="bar">

  <div class="sum"><b id="barTotal">0</b><span id="barCount">還沒點菜</span></div>

</div>

<div class="sheet" id="sheet"><div class="card" id="sheetCard"></div></div>
<div class="toast" id="toast"></div>

function mix(hex,w){
  var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);
  if(w>=0){ r=Math.round(r+(255-r)*w); g=Math.round(g+(255-g)*w); b=Math.round(b+(255-b)*w); }
  else { var k=1+w; r=Math.round(r*k); g=Math.round(g*k); b=Math.round(b*k); }
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

    var t='';
    var P=[[40,48,-14],[64,43,8],[54,58,-4]];
    for(var i=0;i<P.length;i++){
      t+='<g transform="translate('+P[i][0]+','+P[i][1]+') rotate('+P[i][2]+')">' +
         '<path d="M0 0c-3-9 4-15 12-13 7 2 8 9 3 12 3 2 5 5 4 8l-6-4c-4 2-10 1-13-3z" fill="'+mix(a,-.18)+'"/>' +
         '<path d="M1 -1c-2-8 4-13 11-11 6 1 7 8 2 10 2 2 4 4 3 7l-5-4c-4 1-9 0-11-2z" fill="'+a+'"/>' +
         '<g stroke="'+b+'" stroke-width="1.4" fill="none" stroke-linecap="round"><path d="M2 -3l3 5M7 -6l2 6M12 -7l1 6"/></g>' +
         '</g>';
    }
    return PLATE+t;
  },
  /* 捲餅 */
  roll:function(a,b){
    return PLATE +
      '<rect x="30" y="39" width="58" height="21" rx="10.5" fill="'+mix(a,-.2)+'"/>' +
      '<rect x="30" y="37" width="58" height="21" rx="10.5" fill="'+a+'"/>' +
      '<path d="M36 45h46" stroke="'+b+'" stroke-width="3.2" stroke-linecap="round" opacity=".8"/>' +
      '<g stroke="'+mix(a,-.25)+'" stroke-width="2.2"><path d="M49 38v20M67 38v20"/></g>' +
      '<g fill="#fff" opacity=".3"><ellipse cx="42" cy="42" rx="6" ry="2.4"/></g>';
  },
  /* 水果 */
  fruit:function(a,b){
    return PLATE +
      '<path d="M34 58a26 26 0 0 1 52 0z" fill="#F2EAD2"/>' +
      '<path d="M37 58a23 23 0 0 1 46 0z" fill="'+b+'"/>' +
      '<path d="M42 58a18 18 0 0 1 36 0z" fill="'+a+'"/>' +
      '<g fill="#4A382B"><ellipse cx="53" cy="49" rx="1.7" ry="2.4"/><ellipse cx="67" cy="49" rx="1.7" ry="2.4"/>' +
      '<ellipse cx="60" cy="54" rx="1.7" ry="2.4"/><ellipse cx="60" cy="45" rx="1.7" ry="2.4"/></g>' +
      '<path d="M46 50a15 15 0 0 1 12-6" stroke="#fff" stroke-width="2.2" fill="none" opacity=".35" stroke-linecap="round"/>';
  }
};

function drawDish(spec){
  var p = spec.slice(5).split(":");
  var cs = (p[1]||"#C4694A,#7C8A46").split(",");
  var f = DRAW[p[0]] || DRAW.plate;
  var g = GARNISH[p[2]] || GARNISH.none;
  return '<svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
         tableBG(cs[0]) + f(cs[0], cs[1]||cs[0]) + g() + '</svg>';
}

/* 沒圖時的替代色塊：依 id 取一個固定的暖色 */
var TINTS = ["#C4694A","#7C8A46","#C79A3A","#9A6647","#B2734E","#8E8055","#A85E52","#6F8360"];
function tint(id){ return TINTS[Math.abs(id) % TINTS.length]; }
function thumbHTML(d){
  if (d.img && d.img.indexOf("draw:")===0) return drawDish(d.img);
  if (d.img) return '<img src="'+esc(d.img)+'" alt="'+esc(d.name)+'" loading="lazy" ' +
                    'onerror="this.parentNode.innerHTML=\'<div class=&quot;ph&quot; style=&quot;background:'+tint(d.id)+'&quot;>'+esc((d.name||"菜").charAt(0))+'</div>\'">';
  return '<div class="ph" style="background:'+tint(d.id)+'">'+esc((d.name||"菜").charAt(0))+'</div>';
}

/* 選圖後壓成 480px 的 JPEG */
function pickImage(cb){
  var inp = $("filePick");
  inp.value = "";
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f) return;
    toast("正在處理圖片…");
    var r = new FileReader();
    r.onload = function(){
      var im = new Image();
      im.onload = function(){
        var max = 480, w = im.width, h = im.height;
        var k = Math.min(1, max/Math.max(w,h));
        var c = document.createElement("canvas");
        c.width = Math.max(1,Math.round(w*k));
        c.height = Math.max(1,Math.round(h*k));
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(im,0,0,c.width,c.height);
        var out;
        try { out = c.toDataURL("image/jpeg", 0.72); }
        catch(e){ toast("這張圖讀不了，換一張試試"); return; }
        cb(out);
      };
      im.onerror = function(){ toast("這張圖讀不了，換一張試試"); };
      im.src = r.result;
    };
    r.onerror = function(){ toast("讀取失敗，換一張試試"); };
    r.readAsDataURL(f);
  };
  inp.click();
}

    $("menuArea").innerHTML = '<div class="empty"><b>菜單還是空的</b>點右上角「廚房」→「改菜單」，把今天要做的菜加進去</div>';

  }
  var order=[], groups={};
  for (var i=0;i<live.length;i++){
    var c = (live[i].cat||"").trim() || "菜單";
    if (!groups[c]){ groups[c]=[]; order.push(c); }
    groups[c].push(live[i]);
  }
  var idx = {};
  for (var k=0;k<live.length;k++) idx[live[k].id] = k+1;
  var html = "", single = order.length===1;
  for (var g=0; g<order.length; g++){
    if (!single) html += '<h2 class="cat">'+esc(order[g])+'</h2>';
    html += '<div class="grid">';
    var arr = groups[order[g]];
    for (var j=0;j<arr.length;j++){
      var d = arr[j], q = cart[d.id]||0;

          '<span class="q">'+q+'</span>' +

      }

    }
    html += '</div>';
  }
  $("menuArea").innerHTML = html;
  updateBar();

function cartTotal(){
  var lines=[], t=0, n=0;
  for (var i=0;i<S.dishes.length;i++){
    var d=S.dishes[i], q=cart[d.id];
    if (q>0){ lines.push({name:d.name,price:d.price||0,qty:q}); t+=(d.price||0)*q; n+=q; }
  }
  return {total:t,count:n,lines:lines};
}
function updateBar(){
  var c=cartTotal(), bar=$("bar");
  if (view!=="order" || !c.count){ bar.classList.remove("on"); return; }
  bar.classList.add("on");
  var line = "共 "+c.lines.length+" 樣 · "+c.count+" 份";
  if (S.showPrice && S.budget > 0){
    var left = S.budget - c.total;
    line += (left >= 0)
      ? " · 今晚還剩 "+left+" 顆"
      : ' · <span class="over">超了 '+(-left)+' 顆</span>';
  }
  $("barCount").innerHTML = line;
  $("barTotal").innerHTML = S.showPrice ? (hearts(c.total)+' <span style="font-size:15px;opacity:.8">'+c.total+'</span>')
                                        : (c.count+" 份");
}

  var who = ($("whoIn").value||"").trim() || "客人";

  S.orders.unshift({id:Date.now(),who:who,note:note,items:c.lines,total:c.total,time:Date.now(),done:false});
  if (S.orders.length > 120) S.orders.length = 120;
  if (who!=="客人" && S.people.indexOf(who)===-1){
    S.people.push(who); if (S.people.length>12) S.people.shift();

  if (e.target.id==="addDish"){
    S.dishes.push({id:S.nextId++,name:"",note:"",price:1,cat:"熱菜",img:"",out:false});
    save(); renderMenuEditor();
    var b = $("paneMenu").querySelectorAll('.edit input[data-f="name"]');
    if (b.length) b[b.length-1].focus();
    return;
  }
  var btn = e.target.closest("[data-act]"); if (!btn) return;
  var box = btn.closest("[data-did]"); if (!box) return;
  var did = +box.dataset.did, d = findDish(did); if (!d) return;
  var act = btn.dataset.act;

  if (act==="pic"){
    pickImage(function(dataUrl){
      var old = d.img; d.img = dataUrl;
      if (save()){ renderMenuEditor(); toast("圖片加好囉"); }
      else { d.img = old; renderMenuEditor(); }
    });
    return;
  }
  if (act==="url"){
    var u = prompt("把圖片網址貼進來（要以 http 開頭）：", d.img && d.img.indexOf("http")===0 ? d.img : "https://");
    if (u===null) return;
    u = u.trim();
    if (u && !/^https?:\/\//i.test(u)){ toast("網址要以 http 或 https 開頭"); return; }
    d.img = u; save(); renderMenuEditor();
    return;
  }
  if (act==="nopic"){ d.img=""; save(); renderMenuEditor(); return; }
  if (act==="del"){
    if (!confirm("刪掉「"+(d.name||"這道菜")+"」？")) return;
    S.dishes = S.dishes.filter(function(x){ return x.id!==did; });
    delete cart[did]; save(); renderMenuEditor();

$("paneSet").addEventListener("click", function(e){
  if (e.target.id==="loadPack"){
    if (!confirm("菜單會換成內建的 50 道家常菜，原本的菜就沒了。訂單不受影響，確定嗎？")) return;
    S.dishes = JSON.parse(JSON.stringify(DEFAULT.dishes));
    S.nextId = 51; cart = {};
    save(); renderKitchen(); toast("50 道菜都上架囉");
    return;
  }
  if (e.target.id!=="resetAll") return;
  if (!confirm("菜單、圖片和訂單都會恢復成預設的，確定嗎？")) return;
  S = JSON.parse(JSON.stringify(DEFAULT));
  cart = {}; save(); renderKitchen(); renderMenu(); toast("已經恢復囉");
});

/* ---------- 切換 ---------- */
$("navBtn").addEventListener("click", function(){
  view = (view==="order") ? "kitchen" : "order";
  $("viewOrder").hidden   = view!=="order";
  $("viewKitchen").hidden = view!=="kitchen";
  $("navBtn").textContent = (view==="order") ? "廚房" : "去點菜";
  window.scrollTo(0,0);
  if (view==="kitchen") renderKitchen(); else renderMenu();
  updateBar();
});
$("tabOrders").addEventListener("click", function(){ tab="orders"; renderKitchen(); });
$("tabMenu").addEventListener("click",   function(){ tab="menu";   renderKitchen(); });
$("tabSet").addEventListener("click",    function(){ tab="set";    renderKitchen(); });

renderMenu();
</script>

  navigator.serviceWorker.register('sw.js').catch(function(){});
}
