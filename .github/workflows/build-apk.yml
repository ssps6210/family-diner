name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore signing.keystore \
            -alias family-diner \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=FamilyDiner,O=Personal,C=TW" \
            -storepass android123 -keypass android123

      - name: Create twa-manifest.json
        run: |
          python3 - << 'EOF'
          import json
          m = {
            "packageId": "com.ssps6210.familydiner",
            "host": "ssps6210.github.io",
            "name": "爸爸媽媽小食堂",
            "launcherName": "小食堂",
            "display": "standalone",
            "themeColor": "#C4694A",
            "navigationColor": "#C4694A",
            "navigationColorDark": "#A4502F",
            "navigationDividerColor": "#C4694A",
            "navigationDividerColorDark": "#A4502F",
            "backgroundColor": "#FDF5E7",
            "enableNotifications": False,
            "startUrl": "/family-diner/",
            "iconUrl": "https://ssps6210.github.io/family-diner/icon-512.png",
            "maskableIconUrl": "https://ssps6210.github.io/family-diner/icon-512.png",
            "monochromeIconUrl": "https://ssps6210.github.io/family-diner/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./signing.keystore",
              "alias": "family-diner"
            },
            "appVersionCode": 1,
            "appVersion": "1.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://ssps6210.github.io/family-diner/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {},
            "enableSiteSettingsShortcut": True,
            "isChromeOSOnly": False,
            "isMetaQuest": False,
            "fullScopeUrl": "https://ssps6210.github.io/family-diner/",
            "minSdkVersion": 19,
            "orientation": "default"
          }
          with open("twa-manifest.json", "w", encoding="utf-8") as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
          print("twa-manifest.json created")
          EOF

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android123
          BUBBLEWRAP_KEY_PASSWORD: android123
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: bubblewrap build --skipPwaValidation

      - name: Find APK files
        run: find . -name "*.apk" 2>/dev/null | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-diner-apk-v${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
